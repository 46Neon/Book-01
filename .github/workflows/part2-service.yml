name: Part 2A web and service checks

on:
  push:
    branches: [main]
    paths:
      - 'part2/service/**'
      - 'part2/web/**'
      - 'docs/parte-2a-openapi-propuesta.yaml'
      - '.github/workflows/part2-service.yml'
  pull_request:
    paths:
      - 'part2/service/**'
      - 'part2/web/**'
      - 'docs/parte-2a-openapi-propuesta.yaml'
      - '.github/workflows/part2-service.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: part2/web/package-lock.json
      - run: npm ci
        working-directory: part2/web
      - run: npm run check
        working-directory: part2/web

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: part2/service/requirements.txt
      - run: python -m pip install -r part2/service/requirements.txt
      - run: python -m pytest tests
        working-directory: part2/service
