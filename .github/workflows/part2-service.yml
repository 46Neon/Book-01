name: Part 2A read-only service tests

on:
  push:
    branches: [main]
    paths:
      - 'part2/service/**'
      - 'docs/parte-2a-openapi-propuesta.yaml'
      - '.github/workflows/part2-service.yml'
  pull_request:
    paths:
      - 'part2/service/**'
      - 'docs/parte-2a-openapi-propuesta.yaml'
      - '.github/workflows/part2-service.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: part2/service/requirements.txt
      - run: python -m pip install -r part2/service/requirements.txt
      - run: python -m pytest tests
        working-directory: part2/service
