name: Part 2A service checks

on:
  push:
    branches: [main]
    paths:
      - 'part2/service/**'
      - 'docs/parte-2a-openapi-propuesta.yaml'
      - '.github/workflows/part2-service.yml'
  pull_request:
    paths:
      - 'part2/service/**'
      - 'docs/parte-2a-openapi-propuesta.yaml'
      - '.github/workflows/part2-service.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: part2/service/pyproject.toml
      - name: Install service and test dependencies
        working-directory: part2/service
        run: python -m pip install -e '.[test]'
      - name: Validate OpenAPI and run service tests
        working-directory: part2/service
        run: python -m pytest --cov=app --cov-report=term-missing
