name: Supabase database migration checks
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db.yml'
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d book01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: book01_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap test-only Supabase Auth prerequisites
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply baseline migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120001_initial_core.sql
      - name: Test baseline tenant RLS and accounting invariants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_and_invariants.sql
      - name: Apply remaining versioned migrations
        shell: bash
        run: |
          for migration in supabase/migrations/*.sql; do
            if [[ "$migration" == "supabase/migrations/202610120001_initial_core.sql" ]]; then
              continue
            fi
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Test proposal/confirmation transaction RPCs
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/draft_proposals.sql
      - name: Test concurrent confirmation idempotency
        run: bash supabase/tests/concurrent_confirmation.sh
      - name: Test final read-only REST grants and RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/read_only_permissions.sql
